<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — The Chosen Word</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #16120e;
      --surface: #201b15;
      --text: #f0e6d4;
      --text-2: #b8a898;
      --accent: #c89b4a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .wrap { text-align: center; max-width: 400px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: var(--text-2); line-height: 1.6; margin-bottom: 1.5rem; }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid transparent;
    }
    a:hover { border-bottom-color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Page not found</h1>
    <p>This page does not exist, or the link may have changed.</p>
    <a href="/the-chosen-word/">Return to The Chosen Word</a>
  </div>
</body>
</html>
